<div class="container">
    <div *ngIf="rowData">
        <ag-grid-angular class="ag-theme-quartz" style="height: 500px;" [rowData]="rowData" [gridOptions]="gridOptions"
            rowSelection="single" (rowSelected)="onRowSelected($event)" (gridSizeChanged)="onGridSizeChanged($event)"
            (firstDataRendered)="onFirstDataRendered($event)">
        </ag-grid-angular>
    </div>
</div>
