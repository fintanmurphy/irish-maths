<div *ngIf="solutionDetails" class="container">
    <!-- <div class="p-1 bg-success w-100"></div> -->
    <div class="row">
        <h1>{{ solutionDetails.title }}</h1>
    </div>
    <div class="row">
        <div class="col-12 col-md-6">
            <strong>Description:</strong>
            <p>{{ solutionDetails.description }}</p>
        </div>
        <div class="col-12 col-md-6">
            <strong>Year:</strong>
            <p>{{ solutionDetails.year }}</p>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-md-6">
            <strong>Level:</strong>
            <p>{{ solutionDetails.level }}</p>
        </div>
        <div class="col-12 col-md-6">
            <strong>Paper:</strong>
            <p>{{ solutionDetails.paper }}</p>
        </div>
    </div>
</div>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <a [href]="solutionPdfUrl" target="_blank">
                {{solutionPdfName}}
            </a>
        </div>
        <div class="card-body" style="overflow: hidden;">
            <pdf-viewer
                [src]="solutionPdfUrl"
                [rotation]="0"
                [original-size]="true"
                [show-all]="true"
                [fit-to-page]="false"
                [zoom]="1"
                [zoom-scale]="'page-width'"
                [stick-to-page]="false"
                [render-text]="true"
                [external-link-target]="solutionPdfUrl"
                [autoresize]="true"
                [show-borders]="false"
                style="width: 100%; height: 100vh;"
            ></pdf-viewer>
        </div>
    </div>
</div>
